{
  "name": "C1 coordination",
  "run-name": "C1 issue ${{ github.event.issue.number }} comment ${{ github.event.comment.id }}",
  "on": {
    "issue_comment": {
      "types": [
        "created"
      ]
    },
    "push": {
      "branches": [
        "main",
        "feature/develop",
        "feature/c1-cross-repo-coordination"
      ],
      "paths": [
        ".github/workflows/coordination.yml",
        "scripts/github_coordination.py",
        "tests/unit/test_github_coordination.py",
        "docs/CROSS_REPO_COORDINATION.md"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "validate": {
      "if": "github.event_name == 'push'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "steps": [
        {
          "name": "Checkout trusted repository (verified checkout v4 commit)",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "run": "python3 -m unittest tests.unit.test_github_coordination -v"
        }
      ]
    },
    "coordinate": {
      "if": "github.event_name == 'issue_comment' && github.repository == 'taodo/Data-QA-lab' && !github.event.issue.pull_request && github.event.issue.state == 'open' && (github.event.issue.number == 37 || github.event.issue.number == 38) && github.event.comment.user.type == 'User' && github.event.sender.type == 'User' && startsWith(github.event.comment.body, '/coord ')",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "permissions": {
        "contents": "read",
        "actions": "read",
        "issues": "write"
      },
      "concurrency": {
        "group": "c1-coordination-issue-${{ github.event.issue.number }}",
        "cancel-in-progress": false,
        "queue": "max"
      },
      "steps": [
        {
          "name": "Checkout event SHA from trusted default branch, never PR code",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "taodo/Data-QA-lab",
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Validate and record one bounded human-driven update",
          "run": "python3 scripts/github_coordination.py",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          }
        }
      ]
    }
  }
}
