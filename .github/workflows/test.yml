name: tests

on:
  push:
    branches:
      - main
      - feature/develop
      - feature/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: data_qa_lab
          POSTGRES_USER: data_qa_lab
          POSTGRES_PASSWORD: data_qa_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_qa_lab -d data_qa_lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATA_QA_TEST_DATABASE_URL: postgresql://data_qa_lab:data_qa_lab@localhost:5432/data_qa_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test,e2e]'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest discover -s tests/integration -v
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/e2e -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            e2e-artifacts/
            e2e-server.log

  packaged-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: python scripts/container_smoke.py
      - run: docker compose restart app && docker compose up -d --wait --wait-timeout 180
      - run: python scripts/container_smoke.py resume
      - name: Prepare separate loopback demo (no public tunnel)
        run: |
          python -c "from pathlib import Path; import secrets; d=Path('data/generated/demo'); d.mkdir(parents=True,exist_ok=True); (d/'.env.demo').write_text('DEMO_DB_PASSWORD='+secrets.token_hex(32)+'\nDEMO_PUBLIC_HOST=ci-demo.trycloudflare.com\n')"
          docker compose -p data-qa-demo --env-file data/generated/demo/.env.demo -f docker-compose.demo.yml up -d --build --wait --wait-timeout 180
      - name: Verify real demo proxy, HTTPS origin and restart retention
        run: python -m scripts.demo_verify --hostname ci-demo.trycloudflare.com --self-test --restart
      - run: docker compose -p data-qa-demo --env-file data/generated/demo/.env.demo -f docker-compose.demo.yml logs --no-color --tail 100 app proxy postgres
        if: always()
      - run: docker compose -p data-qa-demo --env-file data/generated/demo/.env.demo -f docker-compose.demo.yml down
        if: always()
      - run: docker compose logs --no-color --tail 100 app postgres
        if: always()
      - run: docker compose down
        if: always()
