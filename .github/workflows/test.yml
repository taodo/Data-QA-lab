name: tests

on:
  push:
    branches:
      - main
      - feature/develop
      - feature/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: data_qa_lab
          POSTGRES_USER: data_qa_lab
          POSTGRES_PASSWORD: data_qa_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_qa_lab -d data_qa_lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATA_QA_TEST_DATABASE_URL: postgresql://data_qa_lab:data_qa_lab@localhost:5432/data_qa_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest discover -s tests/integration -v
