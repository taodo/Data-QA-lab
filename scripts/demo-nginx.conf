events { worker_connections 128; }
http {
    # Only the loopback-published origin receives cloudflared traffic.
    # Never trust incoming forwarded client/host values; one fixed proxy peer.
    map $http_x_forwarded_proto $origin_scheme {
        default invalid;
        "" http;
        http http;
        https https;
    }
    limit_req_zone $binary_remote_addr zone=demo:1m rate=10r/s;
    access_log off;
    server {
        listen 8080;
        client_max_body_size 64k;
        client_body_timeout 10s;
        location / {
            limit_req zone=demo burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://172.29.246.3:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            proxy_read_timeout 30s;
        }
    }
}
