services:
  app:
    build: .
    environment:
      DATA_QA_DATABASE_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-data_qa_lab}
      POSTGRES_USER: ${POSTGRES_USER:-data_qa_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_qa_lab}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_qa_lab}
      POSTGRES_USER: ${POSTGRES_USER:-data_qa_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_qa_lab}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "${DATA_QA_POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_qa_lab} -d ${POSTGRES_DB:-data_qa_lab}"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
