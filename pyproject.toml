[project]
name = "data-qa-lab"
version = "0.1.0"
description = "Interactive data pipeline testing and learning platform"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "pipeline*", "qa*", "faults*"]
